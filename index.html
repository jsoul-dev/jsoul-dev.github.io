<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Jsoul</title>
  <meta name="description" content="Jsoul. Links to LinkedIn, GitHub and Steam.">
  <meta name="theme-color" content="#050404">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preload" href="assets/fonts/archivo-black-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/im-fell-english-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/gate.css">
  <link rel="stylesheet" href="assets/css/profile.css">
  <link rel="stylesheet" href="assets/css/player.css">
  <script>document.documentElement.className = 'js';</script>
</head>
<body>
  <div class="backdrop" id="backdrop" aria-hidden="true"></div>
  <canvas class="rain" id="rain" aria-hidden="true"></canvas>

  <div class="brand" aria-hidden="true">
    <svg viewBox="-20 -30 40 60" xmlns="http://www.w3.org/2000/svg">
      <path d="M 0,-22 L 0,22 M -3,-18 L 0,-24 L 3,-18 M 0,-2 L -16,-16 L -10,-22 M 0,-2 L 16,-16 L 10,-22 M 0,-5 L -16,10 L 0,22 L 16,10 Z" stroke="#e0151b" stroke-width="3" stroke-linejoin="miter" stroke-linecap="square" fill="none"/>
      <path d="M 0,-22 L 0,22 M -3,-18 L 0,-24 L 3,-18 M 0,-2 L -16,-16 L -10,-22 M 0,-2 L 16,-16 L 10,-22 M 0,-5 L -16,10 L 0,22 L 16,10 Z" stroke="#ece5d6" stroke-width="1" stroke-linejoin="miter" stroke-linecap="square" fill="none" opacity="0.6"/>
    </svg>
  </div>

  <main class="profile" id="profile" tabindex="-1">
    <figure class="portrait reveal" style="--i:0">
      <div class="plx" id="plx-portrait">
        <img src="assets/images/avatar.jpg" width="360" height="640" alt="Jsoul's avatar: Guts from Berserk, an ink illustration with a red eye.">
      </div>
    </figure>

    <div class="stack">
      <h1 class="name reveal" style="--i:1"><span class="plx" id="plx-name">Jsoul</span></h1>
      <span class="cut-mark reveal" style="--i:2" aria-hidden="true"></span>

      <nav aria-label="Profile links">
        <ul class="links">
          <li class="reveal" style="--i:3">
            <a href="https://linkedin.com/in/johncarlolemence" target="_blank" rel="noopener noreferrer">
              <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
              <span>LinkedIn<span class="sr-only"> (opens in a new tab)</span></span>
            </a>
          </li>
          <li class="reveal" style="--i:4">
            <a href="https://github.com/jsoul-dev" target="_blank" rel="noopener noreferrer">
              <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
              <span>GitHub<span class="sr-only"> (opens in a new tab)</span></span>
            </a>
          </li>
          <li class="reveal" style="--i:5">
            <a href="https://steamcommunity.com/id/0xJsoul" target="_blank" rel="noopener noreferrer">
              <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M.329 10.333A8.01 8.01 0 0 0 7.99 16C12.414 16 16 12.418 16 8s-3.586-8-8.009-8A8.006 8.006 0 0 0 0 7.468l.003.006 4.304 1.769A2.2 2.2 0 0 1 5.62 8.88l1.96-2.844-.001-.04a3.046 3.046 0 0 1 3.042-3.043 3.046 3.046 0 0 1 3.042 3.043 3.047 3.047 0 0 1-3.111 3.044l-2.804 2a2.223 2.223 0 0 1-3.075 2.11 2.22 2.22 0 0 1-1.312-1.568L.33 10.333Z"/><path d="M4.868 12.683a1.715 1.715 0 0 0 1.318-3.165 1.7 1.7 0 0 0-1.263-.02l1.023.424a1.261 1.261 0 1 1-.97 2.33l-.99-.41a1.7 1.7 0 0 0 .882.84Zm3.726-6.687a2.03 2.03 0 0 0 2.027 2.029 2.03 2.03 0 0 0 2.027-2.029 2.03 2.03 0 0 0-2.027-2.027 2.03 2.03 0 0 0-2.027 2.027m2.03-1.527a1.524 1.524 0 1 1-.002 3.048 1.524 1.524 0 0 1 .002-3.048"/></svg>
              <span>Steam<span class="sr-only"> (opens in a new tab)</span></span>
            </a>
          </li>
        </ul>
      </nav>

      <p class="credit reveal" style="--i:6"><span>Art by Kentaro Miura.</span> <span>Music by Susumu Hirasawa.</span></p>
    </div>
  </main>

  <div class="dock" id="dock" role="group" aria-label="Music player">
    <div class="dock-text">
      <span class="dock-title">Gats</span>
      <span class="dock-sub"><span class="dock-artist">Susumu Hirasawa</span> <span aria-hidden="true">-</span> <span id="dock-status" role="status">on loop</span></span>
    </div>
    <div class="dock-controls">
      <button class="dock-btn" id="play" type="button" aria-label="Play music">
        <svg class="i-play" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>
        <svg class="i-pause" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
      </button>
      <label class="volume">
        <span class="sr-only">Volume</span>
        <input id="volume" type="range" min="0" max="1" step="0.02" value="0.2">
        <output id="volume-out" for="volume">20%</output>
      </label>
    </div>
  </div>

  <audio id="bg-audio" src="assets/audio/gats.m4a" loop preload="auto"></audio>

  <button class="gate" id="gate" type="button" aria-label="Enter Jsoul's site. Music will start playing.">
    <canvas id="ascii" aria-hidden="true"></canvas>
    <span class="gate-hint" aria-hidden="true">click to enter</span>
  </button>

  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
